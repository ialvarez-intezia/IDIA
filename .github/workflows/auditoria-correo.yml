name: Auditoría semanal de propuestas

# Corre en los servidores de GitHub, así que funciona aunque la laptop esté apagada.
on:
  schedule:
    # Lunes 12:00 UTC = 08:00 en Venezuela (VET, UTC-4).
    # GitHub usa SIEMPRE UTC; ajusta esta hora si cambias de zona.
    - cron: "0 12 * * 1"
  workflow_dispatch:   # permite dispararla a mano desde la pestaña Actions

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias de Google
        run: |
          pip install --quiet \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Restaurar credenciales OAuth desde los Secrets
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS" > scripts/credentials.json
          printf '%s' "$GOOGLE_TOKEN"       > scripts/token-intezia.json

      - name: Ejecutar la auditoría y enviar el reporte por correo
        run: python3 scripts/auditar-correo.py --email

      - name: Borrar credenciales del runner
        if: always()
        run: rm -f scripts/credentials.json scripts/token-intezia.json
