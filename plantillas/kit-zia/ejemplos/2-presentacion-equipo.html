    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const X = "expo.out", E = "power3.out", EI = "power2.in", IO = "power3.inOut";
      const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
      let seed = 23; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const T = 18;

      // palabras: entran con escala desde abajo, sin blur (otra entrada que la del video de directores)
      function words(sel) {
        $$(sel + " .w").forEach((w) => {
          if (!w.dataset.t) return;
          tl.fromTo(w, { opacity: 0, scale: 0.4, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(2.2)" }, +w.dataset.t - 0.05);
        });
      }

      // ---------- Zia
      const ZO = "175px 275px", ZC = "175px 160px";
      const zq = (z, c) => `${z} .${c}`;
      ["#z1", "#z2", "#z3", "#z4", "#z5", "#zF"].forEach((z) => {
        $(z).innerHTML = `<div class="zr"><div class="zs">${Zia.svg({ v: "D", shadow: 0 })}</div></div>`;
        const s = $(z).querySelector("svg"); s.setAttribute("width", "350"); s.setAttribute("height", "315");
        gsap.set(zq(z, "zaL"), { rotation: 0, scale: 1, svgOrigin: "-78 -92" });
        gsap.set(zq(z, "zaR"), { rotation: 0, scale: 1, svgOrigin: "78 -92" });
        gsap.set(zq(z, "zfL"), { scale: 1, svgOrigin: "-56 6" });
        gsap.set(zq(z, "zfR"), { scale: 1, svgOrigin: "56 6" });
        gsap.set(z, { x: 540, y: 2450, transformOrigin: ZO });
      });
      const eyes = (z, e, at) => { ["normal", "happy", "surp", "wink", "closed", "worried", "tired"].forEach((k) => tl.set(zq(z, "ze-" + k), { opacity: k === e ? 1 : 0 }, at)); };
      const armTo = (z, side, rot, dur, at, ease) => tl.to(zq(z, side === "L" ? "zaL" : "zaR"), { rotation: rot, svgOrigin: side === "L" ? "-78 -92" : "78 -92", duration: dur, ease: ease || "power2.out" }, at);
      const squash = (z, at, sx, sy, d) => tl.fromTo(zq(z, "zs"), { scaleX: 1, scaleY: 1, transformOrigin: ZO }, { scaleX: sx, scaleY: sy, duration: d || 0.08, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, at);
      const mini = (el, w, eyesK) => { el.innerHTML = Zia.svg({ v: "D", shadow: 0, eyes: eyesK || "happy" }); const s = el.querySelector("svg"); s.setAttribute("width", w); s.setAttribute("height", Math.round(w * 0.9)); };

      // ---------- fondo
      tl.fromTo("#gA", { x: -400, y: 1100 }, { x: 200, y: -200, duration: T, ease: "sine.inOut" }, 0);
      tl.fromTo("#gB", { x: 500, y: -100 }, { x: -100, y: 1200, duration: T, ease: "sine.inOut" }, 0);
      tl.fromTo("#grid", { x: 0, y: 0 }, { x: -120, y: -240, duration: T, ease: "none" }, 0);

      // ---------- S1: el foco se enciende con parpadeo, Zia entra derrapando desde la derecha
      tl.fromTo("#beam", { opacity: 0 }, { opacity: 1, duration: 0.05 }, 0.05);
      tl.to("#beam", { opacity: 0.2, duration: 0.04 }, 0.12); tl.to("#beam", { opacity: 1, duration: 0.04 }, 0.18);
      tl.fromTo("#pool", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: E }, 0.18);
      eyes("#z1", "normal", 0);
      tl.fromTo("#z1", { x: 1350, y: 1600, scale: 1.5, rotation: -16 }, { x: 540, y: 1600, scale: 1.5, rotation: -16, duration: 0.42, ease: "power3.out" }, 0.25);
      tl.to("#z1", { rotation: 0, duration: 0.3, ease: "back.out(3)" }, 0.62);
      squash("#z1", 0.66, 1.1, 0.88, 0.08);
      eyes("#z1", "happy", 0.8);
      armTo("#z1", "R", -110, 0.16, 0.75, "back.out(2)");
      tl.fromTo(zq("#z1", "zaR"), { rotation: -110, svgOrigin: "78 -92" }, { rotation: -140, svgOrigin: "78 -92", duration: 0.13, yoyo: true, repeat: 7, ease: "sine.inOut", immediateRender: false }, 0.92);
      words("#h1a");
      // maquina de escribir con cursor: "equipo!"
      const TW = "equipo!", tw = $("#tw"), TWo = { v: 0 };
      tl.to(TWo, { v: 1, duration: 0.45, ease: "none", onUpdate: () => (tw.textContent = TW.slice(0, Math.round(TWo.v * TW.length))) }, 1.0);
      tl.set({}, { onUpdate: () => (tw.textContent = TW.slice(0, Math.round(TWo.v * TW.length))) }, 0);
      tl.fromTo("#caret", { opacity: 0 }, { opacity: 1, duration: 0.12, yoyo: true, repeat: 7, ease: "steps(1)" }, 0.95);
      tl.fromTo("#h1b", { color: "#FFFFFF" }, { color: "#FFD300", duration: 0.2 }, 1.5);
      tl.to(["#h1a", "#h1b"], { y: -160, opacity: 0, duration: 0.24, ease: EI }, 2.02);
      tl.to(["#beam", "#pool"], { opacity: 0, duration: 0.2 }, 2.05);
      tl.to("#z1", { y: 2450, duration: 0.24, ease: "power2.in" }, 2.04);

      // ---------- S2: el carnet baja colgado, gira y se balancea; sello de NUEVA
      mini($("#bphoto"), 250, "happy");
      tl.fromTo("#swing", { y: -1500, rotation: 0, transformOrigin: "540px -20px" }, { y: 0, rotation: 0, duration: 0.5, ease: "back.out(1.3)" }, 2.22);
      tl.fromTo("#badge", { rotationY: 180, transformPerspective: 1800 }, { rotationY: 0, duration: 0.6, ease: "power2.out" }, 2.25);
      tl.fromTo("#swing", { rotation: 6 }, { rotation: -4, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 2.72);
